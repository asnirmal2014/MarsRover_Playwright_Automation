# ==========================================
# Mars Rover Application Configuration
# ==========================================

# UI Base URL for local HTML testing
# ui.base.url=file:///D:/sts-workspace-springboot_3/MarsRover_Playwright_Automation/index.html
ui.base.url=index.html

# ==========================================
# Browser Configuration
# ==========================================
# We need to comment out or clear the browser.name value so it defaults to an empty string. 
# This tells Playwright to use the bundled Chromium we installed, which works perfectly in both Jenkins and locally.
# Leave empty to use Playwright's bundled Chromium (Recommended for CI/CD stability).
# If you want to test locally with branded Chrome, run Maven with: -Dbrowser.name=chrome
browser.name=

# Slows down Playwright operations in milliseconds (useful for local visual debugging).
# Set to '0' for maximum speed (recommended for parallel execution and CI).
playwright.slowmo=1000

# Set to 'false' to see the maximized browser window locally. 
# NOTE: GitHub Actions will automatically override this to 'true' via the Maven -D flag 
# in the workflow, preventing the "Missing X server" error on the Linux runner.
playwright.headless=false

# ==========================================
# API Configuration
# ==========================================
# Base URL for API tests (Updated to the NASA API we are currently testing)
api.base.url=https://api.nasa.gov
