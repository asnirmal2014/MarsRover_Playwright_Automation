# This is a 'GitHub Actions workflow file' which is automatically get triggered after a successful push to GitHub from Git. (playwright-tests.yml)
# It tells GitHub how to set up a Linux machine, install the tools your project needs, run your Playwright/Cucumber tests.
# Then save the test report.

name: Mars Rover Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code (Downloads your code from GitHub to the Linux machine)
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Setup Java 21 (Installs Java 21 so Maven can compile your code)
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Setup Node.js (Required for Playwright) (Installs Node.js. Playwright requires Node.js to download and manage the Chromium browser binaries)
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 4. Cache Playwright browsers to speed up subsequent runs (Saves the downloaded Chromium browser to GitHub's cache. On future runs, it skips the download, saving ~1 minute of execution time)
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pom.xml') }}

      # 5. Install Playwright's Chromium browser and dependencies
      # It is a shell command on the runner to invoke Playwright's installer and also installs Linux system libraries (fonts, graphics drivers) which Chromium needs to run headless.
      # This does NOT affect Maven flags; headless mode is driven by your Maven test step / ConfigReader.java.
      - name: Install Playwright's Chromium browser and dependencies
        run: npx playwright install --with-deps chromium

      # 6. Run the Maven Tests (Parallel execution will happen automatically based on pom.xml)
      # clean removes previous build output, typically under target/.
      # test runs the tests configured in your Maven project.
      # -Dplaywright.headless=true sets a Java system property named playwright.headless to true.
      # Your test/configuration code must read this property for it to affect browser behavior.
      - name: Run Playwright & Cucumber Tests
        run: mvn clean test -Dplaywright.headless=true

      # 7. Upload Cucumber Reports as an artifact (so you can view it after the run)
      # Uploads files from the runner so you can download them from the workflow run.
      # Because the Linux machine is destroyed immediately after the test finishes, this step zips up your reports and saves them as an "Artifact" in GitHub.
      # if: always() - Asks GitHub to run this step even if an earlier step failed.
      # name: Is the artifact's name in GitHub Actions.
      # path: Is the report file(s) to upload.
      # retention-days: 7  Keeps the artifact for seven days.
      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports
          path: |
            target/cucumber/report.html
            target/cucumber/report.json
          retention-days: 7