# This is a GitHub Actions workflow.
# It tells GitHub how to set up a Linux machine, install the tools your project needs, run your Playwright/Cucumber tests.
# Then save the test report.

name: Mars Rover Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code (Downloads your code from GitHub to the Linux machine)
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Setup Java 21 (Installs Java 21 so Maven can compile your code)
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Setup Node.js (Required for Playwright) (Installs Node.js. Playwright requires Node.js to download and manage the Chromium browser binaries)
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 4. Cache Playwright browsers to speed up subsequent runs (Saves the downloaded Chromium browser to GitHub's cache. On future runs, it skips the download, saving ~1 minute of execution time)
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pom.xml') }}

      # 5. Install Playwright's Chromium browser and dependencies
      # Installs the Chromium browser and the Linux system libraries (fonts, graphics
      # drivers) Chromium needs to run headless. This does NOT affect Maven flags;
      # headless mode is driven by your Maven test step / ConfigReader.java.
      - name: Install Playwright's Chromium browser and dependencies
        run: npx playwright install --with-deps chromium

      # 6. Run the Maven Tests (Parallel execution will happen automatically based on pom.xml)
      - name: Run Playwright & Cucumber Tests
        run: mvn clean test -Dplaywright.headless=true

      # 7. Upload Cucumber HTML Report as an artifact (so you can view it after the run)
      # Because the Linux machine is destroyed immediately after the test finishes, this step zips up your target/cucumber/report.html and saves it as an "Artifact" in GitHub. You can click and download it to see the pretty green report, even if the tests failed.
      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always() # Upload even if tests fail
        with:
          name: cucumber-html-report
          path: target/cucumber/report.html
          retention-days: 7
		  