name: Mars Rover Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Setup Node.js (Required for Playwright)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Cache Playwright browsers to speed up subsequent runs
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pom.xml') }}

      # 5. Install Playwright dependencies (Chrome, etc.)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 6. Run the Maven Tests (Parallel execution will happen automatically based on pom.xml)
      - name: Run Playwright & Cucumber Tests
        run: mvn clean test -Dplaywright.headless=true

      # 7. Upload Cucumber HTML Report as an artifact (so you can view it after the run)
      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always() # Upload even if tests fail
        with:
          name: cucumber-html-report
          path: target/cucumber/report.html
          retention-days: 7